<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e" />
      <stop offset="100%" style="stop-color:#16a34a" />
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6" />
      <stop offset="100%" style="stop-color:#2563eb" />
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6" />
      <stop offset="100%" style="stop-color:#7c3aed" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8" />
    </marker>
  </defs>
  <!-- Background -->
  <rect width="900" height="500" rx="16" fill="url(#bg)" />

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">Marketplace ETL Pipeline — Architecture</text>

  <!-- n8n nodes row -->
  <rect x="40" y="80" width="130" height="50" rx="8" fill="#334155" stroke="#22c55e" stroke-width="2"/>
  <text x="105" y="110" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="bold">⏰ Schedule Trigger</text>

  <line x1="170" y1="105" x2="210" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="215" y="80" width="130" height="50" rx="8" fill="#334155" stroke="#22c55e" stroke-width="2"/>
  <text x="280" y="110" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="bold">🌐 HTTP Request</text>

  <line x1="345" y1="105" x2="385" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="390" y="80" width="130" height="50" rx="8" fill="#334155" stroke="#22c55e" stroke-width="2"/>
  <text x="455" y="110" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="bold">📦 Split In Batches</text>

  <line x1="520" y1="105" x2="560" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="565" y="80" width="130" height="50" rx="8" fill="#334155" stroke="#22c55e" stroke-width="2"/>
  <text x="630" y="110" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="bold">⏳ Wait 2s</text>

  <!-- FastAPI endpoints row -->
  <rect x="80" y="200" width="200" height="60" rx="10" fill="url(#blue)" opacity="0.9"/>
  <text x="180" y="225" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">POST /api/parser/extract</text>
  <text x="180" y="243" text-anchor="middle" fill="#dbeafe" font-size="10">BeautifulSoup4 parser</text>

  <line x1="280" y1="230" x2="340" y2="230" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="345" y="200" width="200" height="60" rx="10" fill="url(#purple)" opacity="0.9"/>
  <text x="445" y="225" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">POST /api/parser/transform</text>
  <text x="445" y="243" text-anchor="middle" fill="#ede9fe" font-size="10">Gemini 3.1 Flash Lite</text>

  <line x1="545" y1="230" x2="605" y2="230" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="610" y="200" width="200" height="60" rx="10" fill="url(#green)" opacity="0.9"/>
  <text x="710" y="225" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">POST /api/marketplace/mock-upload</text>
  <text x="710" y="243" text-anchor="middle" fill="#dcfce7" font-size="10">1s delay → marketplace_id</text>

  <!-- Data flow description -->
  <text x="450" y="320" text-anchor="middle" fill="#64748b" font-size="11">⬇ Data flow: URL → RawProductData → CleanProductData → UploadResponse</text>

  <!-- Bottom info -->
  <rect x="100" y="350" width="700" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="450" y="375" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="bold">Pipeline Features</text>
  <text x="130" y="398" fill="#64748b" font-size="10">✓ Idempotency — unique SKU per run</text>
  <text x="130" y="416" fill="#64748b" font-size="10">✓ Error isolation — continueOnFail on every HTTP node</text>
  <text x="130" y="434" fill="#64748b" font-size="10">✓ Rate limiting — batch size 1 + 2s Wait node</text>
  <text x="130" y="452" fill="#64748b" font-size="10">✓ Proxy rotation — HTTP/HTTPS proxy for Gemini + scraper</text>
</svg>